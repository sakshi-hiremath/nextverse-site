<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="br-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d09"/>
      <stop offset="50%" stop-color="#0e1b14"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="br-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="br-glow-g" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#7158ac" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="br-blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#br-bg)"/>
  <circle cx="950" cy="190" r="300" fill="url(#br-glow-g)"/>
  <circle cx="180" cy="580" r="240" fill="#059669" opacity="0.1" filter="url(#br-blur)"/>

  <!-- Top App Navigation -->
  <rect x="40" y="30" width="1120" height="64" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <!-- Leaf / Canopy Icon -->
  <path d="M72 48 C85 48 94 58 94 72 C80 72 72 62 72 48 Z" fill="url(#br-emerald)"/>
  <path d="M72 72 C60 72 52 64 52 52 C65 52 72 60 72 72 Z" fill="#9d86d6" opacity="0.75"/>
  <text x="110" y="68" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="20" letter-spacing="3">BHIVE RESORT</text>
  
  <text x="560" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">SUITES &amp; VILLAS</text>
  <text x="700" y="68" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" letter-spacing="1">EXPERIENCES</text>
  <text x="820" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">WELLNESS</text>
  <text x="930" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">DINING</text>

  <rect x="1020" y="44" width="120" height="36" rx="18" fill="url(#br-emerald)"/>
  <text x="1080" y="67" fill="#03140a" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="0.5">BOOK STAY ↗</text>

  <!-- Hero Content Left -->
  <text x="60" y="160" fill="url(#br-emerald)" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="3">LUXURY NATURE SANCTUARY &amp; RETREAT</text>
  <text x="60" y="215" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="44" letter-spacing="-1">RECONNECT WITH SERENITY.</text>
  <text x="60" y="265" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="44" letter-spacing="-1">CANOPY VILLAS &amp; MINDFUL LIVING.</text>
  
  <text x="60" y="315" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="16" width="520">Immerse in private rainforest pool villas, organic farm-to-table dining, and revitalizing Ayurvedic spa therapies with 24/7 WhatsApp concierge booking.</text>

  <!-- CTA Buttons -->
  <rect x="60" y="345" width="190" height="48" rx="24" fill="#ffffff"/>
  <text x="155" y="375" fill="#041208" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="15" text-anchor="middle">Explore Villas ↗</text>
  
  <rect x="266" y="345" width="200" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
  <text x="366" y="375" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="15" text-anchor="middle">WhatsApp Concierge</text>

  <!-- Live Stats Row -->
  <g transform="translate(60, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">34</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">PRIVATE VILLAS</text>
  </g>
  <g transform="translate(216, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">98.2%</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">FIVE-STAR REVIEWS</text>
  </g>
  <g transform="translate(372, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#9d86d6" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">100%</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">SUSTAINABLE</text>
  </g>

  <!-- Right Visual Cards (Resort Pavilion Illustration & Dynamic Reservation Engine) -->
  <g transform="translate(660, 130)">
    <!-- Big Showcase Card -->
    <rect width="500" height="380" rx="20" fill="linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02))" stroke="rgba(255,255,255,0.12)"/>
    
    <!-- Nature Resort Scene -->
    <rect x="25" y="25" width="450" height="230" rx="14" fill="#0d1b12"/>
    <!-- Foliage / trees silhouettes -->
    <path d="M40 230 C70 140 100 130 140 230 Z" fill="#132a1c" opacity="0.8"/>
    <path d="M120 230 C150 110 190 100 240 230 Z" fill="#1a3826" opacity="0.9"/>
    <path d="M360 230 C390 120 430 110 460 230 Z" fill="#132a1c" opacity="0.8"/>
    <!-- Wooden Canopy Villa -->
    <polygon points="160,150 240,110 320,150" fill="#854d0e"/>
    <rect x="180" y="150" width="120" height="60" fill="#3f2305"/>
    <rect x="195" y="160" width="40" height="45" fill="rgba(254,240,138,0.4)" stroke="rgba(255,255,255,0.2)"/>
    <rect x="245" y="160" width="40" height="45" fill="rgba(254,240,138,0.4)" stroke="rgba(255,255,255,0.2)"/>
    <!-- Plunge pool -->
    <polygon points="150,210 330,210 350,240 130,240" fill="#0f766e"/>
    <line x1="160" y1="225" x2="320" y2="225" stroke="rgba(204,251,241,0.3)" stroke-dasharray="10 6"/>

    <!-- Direct Booking Guarantee badge -->
    <rect x="45" y="45" width="165" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="#34d399"/>
    <circle cx="60" cy="59" r="5" fill="#34d399"/>
    <text x="74" y="63" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">BEST RATE GUARANTEE</text>

    <!-- Resort Details info -->
    <text x="35" y="295" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="20">CANOPY POOL VILLA</text>
    <text x="35" y="320" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14">Private Infinity Pool · Rainforest Vistas · Floating Breakfast</text>

    <!-- Price and reservation trigger -->
    <text x="35" y="355" fill="#34d399" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="22">$340 / night</text>
    <rect x="340" y="332" width="135" height="34" rx="17" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)"/>
    <text x="407" y="353" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12" text-anchor="middle">RESERVE ↗</text>
  </g>

  <!-- Bottom Reservation Bar -->
  <g transform="translate(60, 550)">
    <rect width="1080" height="150" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Item 1 -->
    <g transform="translate(30, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">EXPERIENCE 01</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Rainforest Wellness Spa</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Ayurvedic healing &amp; sound bath meditation</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(380, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#9d86d6" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">EXPERIENCE 02</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Farm-To-Table Dining</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Zero-kilometer culinary creations by chefs</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(730, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">EXPERIENCE 03</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Canopy Trekking</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Guided natural flora &amp; birding expeditions</text>
    </g>
  </g>
</svg>

