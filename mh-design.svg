<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="mh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="50%" stop-color="#111624"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="mh-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="mh-glow" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#7158ac" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="mh-blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#mh-bg)"/>
  <circle cx="950" cy="190" r="300" fill="url(#mh-glow)"/>
  <circle cx="180" cy="580" r="240" fill="#38bdf8" opacity="0.1" filter="url(#mh-blur)"/>

  <!-- Blueprint subtle grid in background -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
  </g>

  <!-- Top App Navigation -->
  <rect x="40" y="30" width="1120" height="64" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
  <!-- Architecture Compass/Cube Icon -->
  <rect x="66" y="48" width="22" height="22" fill="none" stroke="url(#mh-cyan)" stroke-width="2.5"/>
  <line x1="66" y1="48" x2="88" y2="70" stroke="url(#mh-cyan)" stroke-width="2"/>
  <text x="104" y="68" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="20" letter-spacing="3">MH DESIGN &amp; BUILD</text>
  
  <text x="560" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">PROJECTS</text>
  <text x="670" y="68" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14" letter-spacing="1">ARCHITECTURE</text>
  <text x="810" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">INTERIORS</text>
  <text x="920" y="68" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14" letter-spacing="1">TURNKEY</text>

  <rect x="1010" y="44" width="130" height="36" rx="18" fill="url(#mh-cyan)"/>
  <text x="1075" y="67" fill="#04121a" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="0.5">CONSULTATION ↗</text>

  <!-- Hero Content Left -->
  <text x="60" y="160" fill="url(#mh-cyan)" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" letter-spacing="3">VISIONARY ARCHITECTURE &amp; TURNKEY EXECUTION</text>
  <text x="60" y="215" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="44" letter-spacing="-1">BUILDING ICONIC FORMS.</text>
  <text x="60" y="265" fill="#38bdf8" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="44" letter-spacing="-1">PRECISION ENGINEERING &amp; INTERIORS.</text>
  
  <text x="60" y="315" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="16" width="520">From concept blueprints to turnkey handover, we blend progressive architectural thinking with flawless construction management for residential and commercial landmarks.</text>

  <!-- CTA Buttons -->
  <rect x="60" y="345" width="200" height="48" rx="24" fill="#ffffff"/>
  <text x="160" y="375" fill="#04121a" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="15" text-anchor="middle">View Blueprints ↗</text>
  
  <rect x="276" y="345" width="180" height="48" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
  <text x="366" y="375" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="15" text-anchor="middle">Instant Cost Estimator</text>

  <!-- Live Stats Row -->
  <g transform="translate(60, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">120K+</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">SQ FT DELIVERED</text>
  </g>
  <g transform="translate(216, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#38bdf8" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">45+</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">PROJECTS BUILT</text>
  </g>
  <g transform="translate(372, 425)">
    <rect width="140" height="74" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="34" fill="#9d86d6" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="24">100%</text>
    <text x="20" y="56" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">ON-TIME DELIVERY</text>
  </g>

  <!-- Right Visual Cards (Architecture Blueprint & 3D Render) -->
  <g transform="translate(660, 130)">
    <!-- Big Showcase Card -->
    <rect width="500" height="380" rx="20" fill="linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02))" stroke="rgba(255,255,255,0.12)"/>
    
    <!-- Blueprint / Render Split View -->
    <rect x="25" y="25" width="450" height="230" rx="14" fill="#0f1422"/>
    
    <!-- Wireframe Isometric Architecture -->
    <polygon points="120,180 250,110 380,180 250,230" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="120,110 250,40 380,110 250,160" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <line x1="120" y1="180" x2="120" y2="110" stroke="#38bdf8" stroke-width="2"/>
    <line x1="250" y1="230" x2="250" y2="160" stroke="#38bdf8" stroke-width="2"/>
    <line x1="380" y1="180" x2="380" y2="110" stroke="#38bdf8" stroke-width="2"/>

    <!-- Dimension lines & ticks -->
    <line x1="100" y1="110" x2="100" y2="180" stroke="rgba(255,255,255,0.4)" stroke-dasharray="3 3"/>
    <text x="80" y="150" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">24.5M</text>
    
    <line x1="250" y1="245" x2="380" y2="195" stroke="rgba(255,255,255,0.4)" stroke-dasharray="3 3"/>
    <text x="315" y="235" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">42.0M</text>

    <!-- BIM Mode Active pill -->
    <rect x="45" y="45" width="140" height="28" rx="14" fill="rgba(0,0,0,0.6)" stroke="#38bdf8"/>
    <circle cx="60" cy="59" r="5" fill="#38bdf8"/>
    <text x="74" y="63" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">3D BIM MODEL READY</text>

    <!-- Project info -->
    <text x="35" y="295" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="20">VERTEX COMMERCIAL PAVILION</text>
    <text x="35" y="320" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="14">Mixed-Use Commercial Hub · 48,000 Sq Ft · Turnkey Execution</text>

    <!-- Action -->
    <text x="35" y="355" fill="#38bdf8" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="22">Completed on Schedule</text>
    <rect x="345" y="332" width="130" height="34" rx="17" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)"/>
    <text x="410" y="353" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12" text-anchor="middle">VIEW PLANS ↗</text>
  </g>

  <!-- Bottom Projects Strip -->
  <g transform="translate(60, 550)">
    <rect width="1080" height="150" rx="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Item 1 -->
    <g transform="translate(30, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DISCIPLINE 01</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Turnkey Construction</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Structural engineering &amp; general contracting</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(380, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#9d86d6" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DISCIPLINE 02</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Bespoke Interiors</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Material selection, joinery &amp; lighting design</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(730, 25)">
      <rect width="320" height="100" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
      <text x="24" y="38" fill="#e2c974" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">DISCIPLINE 03</text>
      <text x="24" y="64" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="18">Architectural Planning</text>
      <text x="24" y="86" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Permits, zoning compliance &amp; environmental audits</text>
    </g>
  </g>
</svg>

