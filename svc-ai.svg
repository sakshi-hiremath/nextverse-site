<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="sai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0815"/>
      <stop offset="100%" stop-color="#140f29"/>
    </linearGradient>
    <linearGradient id="sai-node1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sai-node2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sai-node3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="900" height="550" rx="20" fill="url(#sai-bg)"/>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- AI Workflow Pipeline Canvas -->
  <g transform="translate(60, 50)">
    <!-- Header info -->
    <rect width="780" height="450" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="35" y="45" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="2">AUTONOMOUS WORKFLOW PIPELINE · REAL-TIME</text>
    
    <!-- Connection lines -->
    <path d="M 180 180 C 260 180, 260 140, 340 140" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M 180 180 C 260 180, 260 250, 340 250" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 500 140 C 560 140, 560 200, 620 200" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <path d="M 500 250 C 560 250, 560 200, 620 200" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4"/>

    <!-- Step 1: Ingestion Node -->
    <g transform="translate(40, 130)">
      <rect width="140" height="100" rx="12" fill="#141126" stroke="rgba(255,255,255,0.15)"/>
      <rect x="15" y="15" width="24" height="24" rx="6" fill="url(#sai-node1)"/>
      <text x="50" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">TRIGGER</text>
      <text x="15" y="62" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="12">Customer Event</text>
      <text x="15" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Webhook Ingest</text>
    </g>

    <!-- Step 2A: LLM Reasoner Node -->
    <g transform="translate(340, 90)">
      <rect width="160" height="100" rx="12" fill="#17112e" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="15" y="15" width="24" height="24" rx="6" fill="url(#sai-node2)"/>
      <text x="50" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">AI REASONER</text>
      <text x="15" y="62" fill="#d8b4fe" font-family="'Inter Tight', sans-serif" font-size="12">Document &amp; Intent</text>
      <text x="15" y="80" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">99.8% Confidence</text>
    </g>

    <!-- Step 2B: Vector Store Node -->
    <g transform="translate(340, 210)">
      <rect width="160" height="100" rx="12" fill="#0f192b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="15" y="15" width="24" height="24" rx="6" fill="url(#sai-node1)"/>
      <text x="50" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">KNOWLEDGE</text>
      <text x="15" y="62" fill="#bae6fd" font-family="'Inter Tight', sans-serif" font-size="12">Vector Embeddings</text>
      <text x="15" y="80" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">RAG Semantic Sync</text>
    </g>

    <!-- Step 3: Automated Action Node -->
    <g transform="translate(620, 150)">
      <rect width="130" height="100" rx="12" fill="#0b1e16" stroke="#34d399" stroke-width="1.5"/>
      <rect x="15" y="15" width="24" height="24" rx="6" fill="url(#sai-node3)"/>
      <text x="50" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">ACTION</text>
      <text x="15" y="62" fill="#a7f3d0" font-family="'Inter Tight', sans-serif" font-size="12">Auto-Executed</text>
      <text x="15" y="80" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">CRM / WhatsApp</text>
    </g>

    <!-- Bottom Metrics Console -->
    <rect x="40" y="350" width="700" height="65" rx="10" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.08)"/>
    <text x="65" y="378" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">Pipeline Throughput: 14,200 req / day</text>
    <text x="65" y="398" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">LATENCY: 42MS · ZERO ERROR LOGS</text>
    
    <rect x="580" y="365" width="130" height="34" rx="8" fill="rgba(124,58,237,0.2)" stroke="#7c3aed"/>
    <text x="645" y="387" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12" text-anchor="middle">ACTIVE AGENT</text>
  </g>
</svg>

