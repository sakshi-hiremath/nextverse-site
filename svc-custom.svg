<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14"/>
      <stop offset="100%" stop-color="#101529"/>
    </linearGradient>
    <linearGradient id="sc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="900" height="550" rx="20" fill="url(#sc-bg)"/>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- Enterprise ERP / Custom Operations Mockup -->
  <g transform="translate(60, 45)">
    <rect width="780" height="430" rx="14" fill="#0f1424" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Top toolbar -->
    <rect width="780" height="50" rx="14" fill="#151c33"/>
    <text x="25" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="15">ENTERPRISE CORE · OPERATIONS CONTROL</text>
    <rect x="620" y="10" width="135" height="30" rx="15" fill="rgba(56,189,248,0.15)" stroke="#38bdf8"/>
    <text x="687" y="29" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SYNC LIVE</text>

    <!-- Data Table Mockup -->
    <g transform="translate(25, 75)">
      <!-- Table Header -->
      <rect width="730" height="34" rx="6" fill="rgba(255,255,255,0.04)"/>
      <text x="20" y="22" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">MODULE ID</text>
      <text x="180" y="22" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">RESOURCE / ASSET</text>
      <text x="380" y="22" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">ALLOCATION</text>
      <text x="560" y="22" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">STATUS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 45)">
        <rect width="730" height="45" rx="6" fill="#13192e" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">MOD-8402</text>
        <text x="180" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Inventory &amp; Warehouse Sync</text>
        <text x="380" y="28" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="13">Regional Node 01</text>
        <rect x="560" y="14" width="75" height="20" rx="10" fill="rgba(52,211,153,0.15)"/>
        <text x="597" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OPTIMAL</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 100)">
        <rect width="730" height="45" rx="6" fill="#13192e" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">MOD-8403</text>
        <text x="180" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Automated Invoicing &amp; Taxes</text>
        <text x="380" y="28" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="13">Financial Gateway</text>
        <rect x="560" y="14" width="75" height="20" rx="10" fill="rgba(52,211,153,0.15)"/>
        <text x="597" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">OPTIMAL</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 155)">
        <rect width="730" height="45" rx="6" fill="#13192e" stroke="rgba(255,255,255,0.04)"/>
        <text x="20" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">MOD-8404</text>
        <text x="180" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Supplier Dispatch Pipeline</text>
        <text x="380" y="28" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="13">Fleet Tracker API</text>
        <rect x="560" y="14" width="85" height="20" rx="10" fill="rgba(157,134,214,0.15)"/>
        <text x="602" y="28" fill="#9d86d6" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">DISPATCHING</text>
      </g>

      <!-- Bottom System Status -->
      <g transform="translate(0, 220)">
        <rect width="730" height="90" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
        <text x="25" y="35" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="14">Scalable Microservice Architecture</text>
        <text x="25" y="60" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="13">Docker containerized, auto-healing Kubernetes nodes, and automated daily encrypted database snapshots.</text>
      </g>
    </g>
  </g>
</svg>

