<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="impl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a14"/>
      <stop offset="100%" stop-color="#151226"/>
    </linearGradient>
    <linearGradient id="impl-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d86d6"/>
      <stop offset="100%" stop-color="#7158ac"/>
    </linearGradient>
    <linearGradient id="impl-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="impl-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="900" height="550" rx="20" fill="url(#impl-bg)"/>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- Main System Implementation Dashboard Window -->
  <g transform="translate(60, 45)">
    <rect width="780" height="460" rx="16" fill="#100d1c" stroke="rgba(255,255,255,0.12)" filter="drop-shadow(0 30px 60px rgba(0,0,0,0.7))"/>
    
    <!-- Window Bar -->
    <rect width="780" height="42" rx="16" fill="#18142a"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    <text x="390" y="26" fill="#a9a4ba" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">enterprise-platform.implementation.nextverse</text>
    <rect x="670" y="12" width="90" height="20" rx="10" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
    <text x="715" y="25" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">LIVE SYNC</text>

    <!-- Left Config Panel: Platforms Implemented -->
    <g transform="translate(26, 62)">
      <rect width="220" height="374" rx="12" fill="#151124" stroke="rgba(255,255,255,0.06)"/>
      <text x="18" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">CONFIGURED PLATFORMS</text>
      
      <!-- Zoho Ecosystem Card -->
      <g transform="translate(14, 42)">
        <rect width="192" height="66" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(157,134,214,0.3)"/>
        <circle cx="26" cy="33" r="14" fill="url(#impl-accent)"/>
        <text x="26" y="38" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="13" text-anchor="middle">Z</text>
        <text x="50" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Zoho Suite</text>
        <text x="50" y="44" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="10">CRM · Books · Desk · Forms</text>
        <rect x="50" y="48" width="60" height="2" fill="#10b981" rx="1"/>
      </g>

      <!-- ERP & Accounting Card -->
      <g transform="translate(14, 118)">
        <rect width="192" height="66" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
        <circle cx="26" cy="33" r="14" fill="url(#impl-blue)"/>
        <text x="26" y="38" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="12" text-anchor="middle">ERP</text>
        <text x="50" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Business Ops</text>
        <text x="50" y="44" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="10">Inventory · Billing · Orders</text>
      </g>

      <!-- Custom Workflow Engine Card -->
      <g transform="translate(14, 194)">
        <rect width="192" height="66" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
        <circle cx="26" cy="33" r="14" fill="url(#impl-gold)"/>
        <text x="26" y="37" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="11" text-anchor="middle">API</text>
        <text x="50" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Integration Hub</text>
        <text x="50" y="44" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="10">Webhooks · Data Pipelines</text>
      </g>

      <!-- Status Footer -->
      <g transform="translate(14, 272)">
        <rect width="192" height="88" rx="8" fill="rgba(157,134,214,0.08)" stroke="rgba(157,134,214,0.2)"/>
        <text x="14" y="24" fill="#9d86d6" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ZERO COMPLEXITY</text>
        <text x="14" y="44" fill="#cfcad9" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="500">Configured specifically for</text>
        <text x="14" y="60" fill="#cfcad9" font-family="'Inter Tight', sans-serif" font-size="11" font-weight="500">your team's actual workflow.</text>
        <circle cx="170" cy="70" r="5" fill="#10b981"/>
      </g>
    </g>

    <!-- Right Workflow Mapping Canvas -->
    <g transform="translate(264, 62)">
      <rect width="490" height="374" rx="12" fill="#141022" stroke="rgba(255,255,255,0.06)"/>
      <text x="22" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="13">WORKFLOW INTEGRATION PIPELINE</text>
      <text x="360" y="28" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">OPERATIONAL FIT: 100%</text>

      <!-- Flowchart Nodes -->
      <!-- Step 1: Business Requirements -->
      <g transform="translate(22, 50)">
        <rect width="134" height="74" rx="8" fill="#1b162f" stroke="rgba(255,255,255,0.12)"/>
        <text x="14" y="22" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="9">PHASE 01</text>
        <text x="14" y="42" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Requirements</text>
        <text x="14" y="58" fill="#9d86d6" font-family="'Inter Tight', sans-serif" font-size="10">Consult &amp; Audit</text>
      </g>

      <!-- Connection line -->
      <line x1="156" y1="87" x2="186" y2="87" stroke="#7158ac" stroke-width="2" stroke-dasharray="3 3"/>
      <polygon points="186,84 192,87 186,90" fill="#7158ac"/>

      <!-- Step 2: Platform Configuration -->
      <g transform="translate(192, 50)">
        <rect width="144" height="74" rx="8" fill="#1f1837" stroke="rgba(157,134,214,0.4)"/>
        <text x="14" y="22" fill="#9d86d6" font-family="'JetBrains Mono', monospace" font-size="9">PHASE 02</text>
        <text x="14" y="42" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Zoho &amp; Platform</text>
        <text x="14" y="58" fill="#38bdf8" font-family="'Inter Tight', sans-serif" font-size="10">Configuration</text>
      </g>

      <!-- Connection line -->
      <line x1="336" y1="87" x2="366" y2="87" stroke="#7158ac" stroke-width="2" stroke-dasharray="3 3"/>
      <polygon points="366,84 372,87 366,90" fill="#7158ac"/>

      <!-- Step 3: Seamless Integration -->
      <g transform="translate(372, 50)">
        <rect width="96" height="74" rx="8" fill="#1b162f" stroke="rgba(16,185,129,0.3)"/>
        <text x="12" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">PHASE 03</text>
        <text x="12" y="42" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12">Workflow</text>
        <text x="12" y="58" fill="#10b981" font-family="'Inter Tight', sans-serif" font-size="10">Integrated</text>
      </g>

      <!-- Interactive Data Sync View -->
      <g transform="translate(22, 146)">
        <rect width="446" height="136" rx="10" fill="#100d1c" stroke="rgba(255,255,255,0.08)"/>
        <text x="16" y="24" fill="#a9a4ba" font-family="'JetBrains Mono', monospace" font-size="10">OPERATIONAL SYNC METRICS</text>

        <!-- Metric 1 -->
        <g transform="translate(16, 40)">
          <text x="0" y="16" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="11">Data Migration Fidelity</text>
          <text x="0" y="40" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="600">100%</text>
          <text x="0" y="58" fill="#10b981" font-family="'Inter Tight', sans-serif" font-size="10">Zero Data Loss</text>
        </g>

        <!-- Metric 2 -->
        <g transform="translate(160, 40)">
          <text x="0" y="16" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="11">Team Adoption Rate</text>
          <text x="0" y="40" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="600">98.4%</text>
          <text x="0" y="58" fill="#10b981" font-family="'Inter Tight', sans-serif" font-size="10">Intuitive Workflow</text>
        </g>

        <!-- Metric 3 -->
        <g transform="translate(300, 40)">
          <text x="0" y="16" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="11">Workflow Friction</text>
          <text x="0" y="40" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="600">-65%</text>
          <text x="0" y="58" fill="#38bdf8" font-family="'Inter Tight', sans-serif" font-size="10">Hours Saved / Week</text>
        </g>
      </g>

      <!-- Value Proposition Banner -->
      <g transform="translate(22, 298)">
        <rect width="446" height="58" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
        <text x="16" y="24" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="500" font-size="12">Practical Technology Over Complexity</text>
        <text x="16" y="42" fill="#8f8a9f" font-family="'Inter Tight', sans-serif" font-size="11">Making existing software genuinely useful in daily operations.</text>
      </g>
    </g>
  </g>
</svg>

