<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="sw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0915"/>
      <stop offset="100%" stop-color="#140f26"/>
    </linearGradient>
    <linearGradient id="sw-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d86d6"/>
      <stop offset="100%" stop-color="#7158ac"/>
    </linearGradient>
  </defs>
  <rect width="900" height="550" rx="20" fill="url(#sw-bg)"/>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="none" stroke="rgba(255,255,255,0.1)"/>
  
  <!-- Browser Window Mockup -->
  <g transform="translate(60, 45)">
    <rect width="640" height="420" rx="14" fill="#120e20" stroke="rgba(255,255,255,0.12)"/>
    <!-- Browser Top Bar -->
    <rect width="640" height="38" rx="14" fill="#1b152e"/>
    <circle cx="22" cy="19" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="19" r="5" fill="#ffbd2e"/>
    <circle cx="54" cy="19" r="5" fill="#27c93f"/>
    <rect x="80" y="8" width="340" height="22" rx="11" fill="rgba(255,255,255,0.06)"/>
    <text x="140" y="23" fill="#8f8a9f" font-family="'JetBrains Mono', monospace" font-size="11">https://nextverse.io/client</text>

    <!-- Browser Body -->
    <rect x="40" y="65" width="280" height="32" rx="8" fill="url(#sw-purple)" opacity="0.9"/>
    <rect x="40" y="112" width="460" height="14" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="40" y="136" width="380" height="14" rx="4" fill="rgba(255,255,255,0.1)"/>
    
    <!-- Hero interactive image card inside -->
    <rect x="40" y="175" width="260" height="150" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="170" cy="235" r="30" fill="url(#sw-purple)" opacity="0.3"/>
    <rect x="70" y="280" width="200" height="12" rx="4" fill="rgba(255,255,255,0.2)"/>
    
    <rect x="320" y="175" width="280" height="150" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="345" y="200" width="120" height="18" rx="4" fill="#9d86d6"/>
    <rect x="345" y="230" width="230" height="10" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="345" y="248" width="190" height="10" rx="4" fill="rgba(255,255,255,0.15)"/>
    <rect x="345" y="280" width="90" height="28" rx="14" fill="#ffffff"/>

    <rect x="40" y="350" width="560" height="45" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Mobile View Mockup Overlay (Floating) -->
  <g transform="translate(630, 110)">
    <rect width="210" height="390" rx="24" fill="#0b0816" stroke="rgba(255,255,255,0.2)" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))"/>
    <!-- Speaker notch -->
    <rect x="80" y="12" width="50" height="6" rx="3" fill="#2b2342"/>
    <!-- Screen content -->
    <rect x="15" y="34" width="180" height="340" rx="16" fill="#130e24"/>
    <rect x="28" y="55" width="90" height="14" rx="4" fill="#9d86d6"/>
    <rect x="28" y="80" width="154" height="90" rx="8" fill="rgba(255,255,255,0.06)"/>
    <rect x="28" y="185" width="130" height="12" rx="3" fill="rgba(255,255,255,0.3)"/>
    <rect x="28" y="205" width="110" height="10" rx="3" fill="rgba(255,255,255,0.15)"/>
    <rect x="28" y="230" width="70" height="24" rx="12" fill="#ffffff"/>
  </g>
</svg>

