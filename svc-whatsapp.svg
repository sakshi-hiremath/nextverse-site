<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <linearGradient id="swp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e0b"/>
      <stop offset="100%" stop-color="#121f17"/>
    </linearGradient>
    <linearGradient id="swp-wa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
  </defs>
  <rect width="900" height="550" rx="20" fill="url(#swp-bg)"/>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="none" stroke="rgba(255,255,255,0.1)"/>

  <!-- Phone Mockup Container Centered -->
  <g transform="translate(240, 30)">
    <rect width="420" height="490" rx="28" fill="#0d1410" stroke="rgba(255,255,255,0.18)" stroke-width="2" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.8))"/>
    
    <!-- Phone Top Chat Bar -->
    <rect width="420" height="65" rx="28" fill="#14241b"/>
    <!-- Avatar -->
    <circle cx="45" cy="36" r="18" fill="url(#swp-wa)"/>
    <text x="45" y="42" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="700" font-size="16" text-anchor="middle">N</text>
    <!-- Business Name & Verified Badge -->
    <text x="75" y="32" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="15">Nextverse Assistant</text>
    <!-- Verified Check -->
    <circle cx="218" cy="27" r="7" fill="#25d366"/>
    <text x="218" y="30" fill="#ffffff" font-size="8" text-anchor="middle">✓</text>
    <text x="75" y="48" fill="#34d399" font-family="'Inter Tight', sans-serif" font-size="11">Automated · Typically replies instantly</text>

    <!-- Chat Messages Body -->
    <g transform="translate(20, 85)">
      <!-- Incoming Customer Msg -->
      <g transform="translate(180, 10)">
        <rect width="200" height="42" rx="12" fill="#056162"/>
        <text x="15" y="26" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Hi, I'd like to book a tour!</text>
      </g>

      <!-- Bot Instant Reply -->
      <g transform="translate(10, 65)">
        <rect width="320" height="110" rx="14" fill="#1f2c24"/>
        <text x="18" y="28" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">BOT AUTOMATION · VERIFIED</text>
        <text x="18" y="52" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Welcome to Hive Estates! I can instantly reserve your private walkthrough.</text>
        <text x="18" y="74" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="12">Please select your preferred date &amp; villa type:</text>
        <text x="18" y="98" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">Automated CRM Lead Created #4829</text>
      </g>

      <!-- Interactive Quick Reply Buttons -->
      <g transform="translate(10, 190)">
        <rect width="180" height="34" rx="8" fill="rgba(37,211,102,0.15)" stroke="#25d366"/>
        <text x="90" y="22" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12" text-anchor="middle">Canopy Penthouse ↗</text>
      </g>
      <g transform="translate(200, 190)">
        <rect width="170" height="34" rx="8" fill="rgba(37,211,102,0.15)" stroke="#25d366"/>
        <text x="85" y="22" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="600" font-size="12" text-anchor="middle">Azure Shoreline ↗</text>
      </g>

      <!-- Second Bot Follow-up with Calendar sync -->
      <g transform="translate(10, 240)">
        <rect width="340" height="90" rx="14" fill="#1f2c24"/>
        <text x="18" y="28" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-size="13">Confirmed! Your private tour is scheduled for tomorrow at 11:00 AM.</text>
        <text x="18" y="52" fill="#a9a4ba" font-family="'Inter Tight', sans-serif" font-size="12">Calendar invite &amp; VIP gate pass sent to your email.</text>
        
        <rect x="18" y="62" width="130" height="20" rx="6" fill="rgba(255,255,255,0.08)"/>
        <text x="83" y="76" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">SYNCED TO GOOGLE CAL</text>
      </g>
    </g>

    <!-- Bottom Message Input Bar Mockup -->
    <g transform="translate(20, 435)">
      <rect width="330" height="40" rx="20" fill="#17221b"/>
      <text x="20" y="25" fill="#698574" font-family="'Inter Tight', sans-serif" font-size="13">Type a message...</text>
      <circle cx="390" cy="20" r="18" fill="url(#swp-wa)"/>
      <polygon points="386,13 398,20 386,27" fill="#ffffff"/>
    </g>
  </g>
</svg>

